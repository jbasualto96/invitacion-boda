<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Javiera & Jorge</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
#video,#poster{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
#poster{z-index:5}
#tap{position:fixed;inset:0;z-index:10;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#fade{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none;transition:opacity .8s ease}
#fade.on{opacity:1}
</style>
</head>
<body>
<video id="video" playsinline preload="auto">
  <source src="sobre.mp4" type="video/mp4">
</video>
<img id="poster" src="portada.png" alt="Javiera y Jorge">
<button id="tap" type="button" aria-label="Abrir invitación"></button>
<div id="fade"></div>
<script>
const DESTINO="https://javierayjorge.my.canva.site/copia-de-javiera-jorge";
const v=document.getElementById("video");
const poster=document.getElementById("poster");
const tap=document.getElementById("tap");
const fade=document.getElementById("fade");

tap.addEventListener("click",async()=>{
  v.muted=false; v.volume=1; v.currentTime=0;
  try{
    await v.play();
    poster.style.display="none";
    tap.style.display="none";
  }catch(e){}
});

v.addEventListener("ended",()=>{
  fade.classList.add("on");
  setTimeout(()=>window.location.replace(DESTINO),820);
});
</script>
</body>
</html>
